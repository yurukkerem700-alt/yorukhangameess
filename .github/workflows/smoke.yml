name: Oyun testi
# Her değişiklikte oyunları ve SEO sayfalarını otomatik test eder (Claude'un token'ı harcanmaz).
on:
  pull_request:
  push:
    branches: [main]
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm i --no-save playwright
      - run: npx playwright install --with-deps chromium
      - run: node tools/build-pages.mjs && git diff --exit-code -- g sitemap.xml slugs.js
        name: Üretilen sayfalar güncel mi?
      - run: node tools/smoke.mjs
