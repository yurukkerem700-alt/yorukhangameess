<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Halat Çekme</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #1a0f08; touch-action: none; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; font-family: system-ui, -apple-system, 'Segoe UI', sans-serif; }
  canvas { display: block; width: 100vw; height: 100vh; }
  #ui { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; pointer-events: none; }
  .panel { pointer-events: auto; text-align: center; color: #fff; background: rgba(20,10,4,.82); border: 1px solid rgba(255,200,120,.2); backdrop-filter: blur(6px); padding: 22px 24px; border-radius: 20px; width: min(420px, 88vw); }
  .panel h1 { margin: 0 0 4px; font-size: clamp(30px, 8vw, 46px); letter-spacing: 1px; background: linear-gradient(90deg,#ffcf6a,#ff6a1a); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .panel p { margin: 6px 0; color: #eadbc8; font-size: 15px; line-height: 1.4; }
  .btn { display: block; width: 100%; margin-top: 10px; background: #fff; color: #1a0f08; border: 0; border-radius: 14px; padding: 15px 10px; font-size: 18px; font-weight: 800; cursor: pointer; touch-action: manipulation; }
  .btn.two { background: linear-gradient(90deg,#ff4a3a,#3aa8ff); color: #fff; }
  .row { display: flex; gap: 8px; margin-top: 10px; }
  .row .btn { margin-top: 0; font-size: 15px; padding: 12px 6px; background: rgba(255,255,255,.12); color: #fff; }
  .row .btn.on { background: #ffcf6a; color: #1a0f08; }
  .small { font-size: 12px !important; opacity: .75; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="ui"><div class="panel" id="panel"></div></div>
<script>
(() => {
  const cv = document.getElementById('c'), ctx = cv.getContext('2d');
  if (!ctx.roundRect) ctx.roundRect = function (x, y, w, h) { this.rect(x, y, w, h); };
  let W, H, DPR;
  function resize() { DPR = Math.min(2, devicePixelRatio || 1); W = innerWidth; H = innerHeight; cv.width = W * DPR; cv.height = H * DPR; ctx.setTransform(DPR, 0, 0, DPR, 0, 0); }
  addEventListener('resize', resize); resize();
  const store = { get(k, d) { try { const v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); } catch (e) { return d; } }, set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} } };

  // ---------- SES (Web Audio, dosya yok) ----------
  let ac = null;
  function beep(f, d, type, vol) { try { ac = ac || new (window.AudioContext || window.webkitAudioContext)(); const o = ac.createOscillator(), g = ac.createGain(); o.type = type || 'square'; o.frequency.value = f; g.gain.value = vol || 0.05; g.gain.exponentialRampToValueAtTime(0.0001, ac.currentTime + d); o.connect(g).connect(ac.destination); o.start(); o.stop(ac.currentTime + d); } catch (e) {} }
  const buzz = (p) => { try { navigator.vibrate && navigator.vibrate(p); } catch (e) {} };

  // ---------- DURUM ----------
  const TEAMS = [{ name: 'KIZIL', col: '#ff4a3a', dark: '#6a120a' }, { name: 'MAVİ', col: '#3aa8ff', dark: '#0a3a6a' }];
  let mode = 'bot', diff = store.get('halat_diff', 1); // 0 kolay, 1 orta, 2 zor
  let state = 'menu', rope = 0, vel = 0, score = [0, 0], round = 1, winner = -1, t = 0, count = 0, flash = [0, 0], bursts = [null, null], taps = [0, 0], botT = 0, fx = [], shake = 0;
  const WIN_AT = 1, ROUNDS_TO_WIN = 2;
  let stats = store.get('halat_stats', { botWins: [0, 0, 0], played: 0 });

  // Oyuncu 0 = alt yarı (KIZIL), Oyuncu 1 = üst yarı (MAVİ). Halat konumu: + alt taraf kazanıyor.
  function pull(p, power) {
    if (state !== 'play') return;
    const s = p === 0 ? 1 : -1; vel += s * 0.0105 * power; taps[p]++; flash[p] = 1;
    if (power > 1) { shake = 10; buzz(30); } else buzz(8);
    beep(p === 0 ? 180 + Math.random() * 40 : 240 + Math.random() * 40, 0.05, 'square', 0.035);
  }
  function tapAt(x, y) {
    if (state !== 'play') return;
    const p = mode === 'bot' ? 0 : (y > H / 2 ? 0 : 1);
    const b = bursts[p];
    if (b && Math.hypot(x - b.x, y - b.y) < b.r * 1.3) { bursts[p] = null; pull(p, 6); fx.push({ x, y, t: 0, col: TEAMS[p].col }); beep(660, 0.15, 'triangle', 0.08); return; }
    pull(p, 1);
  }
  // Çoklu dokunuş: her parmak ayrı sayılır (iki oyuncu aynı anda basabilir)
  cv.addEventListener('touchstart', e => { e.preventDefault(); for (const tc of e.changedTouches) tapAt(tc.clientX, tc.clientY); }, { passive: false });
  cv.addEventListener('mousedown', e => tapAt(e.clientX, e.clientY));
  addEventListener('keydown', e => {
    if (e.repeat) return;
    if (state !== 'play') { if (e.code === 'Space' || e.code === 'Enter') { if (state === 'over') showMenu(); } return; }
    if (mode === 'bot' && (e.code === 'Space' || e.code === 'KeyA' || e.code === 'KeyL')) pull(0, 1);
    if (mode === 'duo') { if (e.code === 'KeyA') pull(0, 1); if (e.code === 'KeyL') pull(1, 1); }
    if (e.code === 'KeyS' || (mode === 'bot' && e.code === 'Enter')) { const b = bursts[0]; if (b) { bursts[0] = null; pull(0, 6); fx.push({ x: b.x, y: b.y, t: 0, col: TEAMS[0].col }); } }
    if (mode === 'duo' && e.code === 'KeyK') { const b = bursts[1]; if (b) { bursts[1] = null; pull(1, 6); fx.push({ x: b.x, y: b.y, t: 0, col: TEAMS[1].col }); } }
  });

  // ---------- MENÜ ----------
  const panel = document.getElementById('panel'), ui = document.getElementById('ui');
  function showMenu() {
    state = 'menu'; ui.style.display = 'flex';
    const dn = ['KOLAY', 'ORTA', 'ZOR'];
    panel.innerHTML = `<h1>HALAT ÇEKME</h1>
      <p>Ekrana olabildiğince hızlı dokun, halatı kendi tarafına çek! Parlayan <b>güç halkasına</b> dokunursan 6 kat güçlü çekersin.</p>
      <button class="btn two" id="duo">👥 İKİ KİŞİ · TEK TELEFON</button>
      <p class="small">Telefonu masaya koyun: biri alttan, biri üstten dokunsun.</p>
      <button class="btn" id="bot">🤖 BİLGİSAYARA KARŞI</button>
      <div class="row">${dn.map((n, i) => `<button class="btn ${i === diff ? 'on' : ''}" data-d="${i}">${n}${stats.botWins[i] ? ' 🏆' + stats.botWins[i] : ''}</button>`).join('')}</div>
      <p class="small" style="margin-top:12px">Klavye: A (Kızıl) · L (Mavi) · S / K güç halkası</p>`;
    panel.querySelector('#duo').onclick = () => start('duo');
    panel.querySelector('#bot').onclick = () => start('bot');
    panel.querySelectorAll('[data-d]').forEach(b => b.onclick = () => { diff = +b.dataset.d; store.set('halat_diff', diff); showMenu(); });
  }
  function start(m) { mode = m; score = [0, 0]; round = 1; stats.played++; store.set('halat_stats', stats); newRound(); try { ac = ac || new (window.AudioContext || window.webkitAudioContext)(); ac.resume(); } catch (e) {} }
  function newRound() { ui.style.display = 'none'; state = 'count'; count = 3.2; rope = 0; vel = 0; bursts = [null, null]; taps = [0, 0]; fx = []; botT = 0; }
  function endRound(w) {
    winner = w; score[w]++; state = 'roundEnd'; t = 0; buzz([60, 40, 120]); beep(w === 0 ? 523 : 392, 0.3, 'triangle', 0.08);
    if (score[w] >= ROUNDS_TO_WIN) {
      setTimeout(() => {
        state = 'over'; ui.style.display = 'flex';
        if (mode === 'bot' && w === 0) { stats.botWins[diff]++; store.set('halat_stats', stats); }
        const who = mode === 'bot' ? (w === 0 ? '🏆 KAZANDIN!' : '🤖 BİLGİSAYAR KAZANDI') : `🏆 ${TEAMS[w].name} KAZANDI!`;
        panel.innerHTML = `<h1>${who}</h1><p style="font-size:26px;font-weight:800"><span style="color:${TEAMS[0].col}">${score[0]}</span> — <span style="color:${TEAMS[1].col}">${score[1]}</span></p>
          <button class="btn two" id="again">🔁 RÖVANŞ</button><button class="btn" id="menu" style="background:rgba(255,255,255,.14);color:#fff">ANA MENÜ</button>`;
        panel.querySelector('#again').onclick = () => start(mode); panel.querySelector('#menu').onclick = showMenu;
      }, 1400);
    } else setTimeout(() => { round++; newRound(); }, 1600);
  }

  // ---------- GÜNCELLEME ----------
  function update(dt) {
    t += dt;
    for (let p = 0; p < 2; p++) flash[p] = Math.max(0, flash[p] - dt * 5);
    fx = fx.filter(f => (f.t += dt) < 0.6); shake *= 0.85;
    if (state === 'count') { const prev = Math.ceil(count); count -= dt; if (Math.ceil(count) !== prev && count > 0) beep(440, 0.1); if (count <= 0) { state = 'play'; beep(880, 0.2); } return; }
    if (state !== 'play') return;
    // Bilgisayar: zorluğa göre saniyede dokunma
    if (mode === 'bot') {
      const rate = [5.2, 7.4, 9.6][diff] * (1 + Math.max(0, rope) * 0.25); botT += dt * rate;
      while (botT >= 1) { botT -= 1 + (Math.random() - 0.5) * 0.3; pull(1, 1); }
      const b = bursts[1]; if (b && b.age > [1.4, 0.9, 0.55][diff]) { bursts[1] = null; pull(1, 6); fx.push({ x: b.x, y: b.y, t: 0, col: TEAMS[1].col }); }
    }
    // Güç halkaları: her oyuncunun yarısında ara sıra belirir
    for (let p = 0; p < 2; p++) {
      const b = bursts[p];
      if (b) { b.age += dt; if (b.age > 2.2) bursts[p] = null; }
      else if (Math.random() < dt * 0.45) { const r = Math.min(W, H) * 0.075; bursts[p] = { x: r + Math.random() * (W - 2 * r), y: p === 0 ? H * 0.62 + Math.random() * H * 0.28 : H * 0.1 + Math.random() * H * 0.28, r, age: 0 }; }
    }
    vel *= Math.pow(0.02, dt); rope += vel * dt * 60;
    if (rope >= WIN_AT) endRound(0); else if (rope <= -WIN_AT) endRound(1);
  }

  // ---------- ÇİZİM ----------
  function puller(x, y, col, dark, dir, lean, k) {
    // Basit yörük figürü: dir=+1 aşağı bakan (alt takım yukarıdaki halatı çekiyor)
    ctx.save(); ctx.translate(x, y); ctx.rotate(lean * dir * -1);
    ctx.fillStyle = dark; ctx.fillRect(-k * 0.35, 0, k * 0.25, k * 0.9); ctx.fillRect(k * 0.1, 0, k * 0.25, k * 0.9);
    ctx.fillStyle = col; ctx.beginPath(); ctx.roundRect(-k * 0.45, -k * 0.9, k * 0.9, k * 1.0, k * 0.2); ctx.fill();
    ctx.fillStyle = '#f2c79a'; ctx.beginPath(); ctx.arc(0, -k * 1.2, k * 0.33, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = dark; ctx.beginPath(); ctx.arc(0, -k * 1.32, k * 0.34, Math.PI, 0); ctx.fill();
    ctx.restore();
  }
  function draw() {
    const sx = (Math.random() - 0.5) * shake, sy = (Math.random() - 0.5) * shake;
    ctx.save(); ctx.translate(sx, sy);
    // Zemin: iki takımın yarısı
    for (let p = 0; p < 2; p++) {
      const y0 = p === 0 ? H / 2 : 0, g = ctx.createLinearGradient(0, y0, 0, y0 + H / 2);
      const c = TEAMS[p]; g.addColorStop(0, p === 0 ? '#2a1a0e' : c.dark); g.addColorStop(1, p === 0 ? c.dark : '#2a1a0e');
      ctx.fillStyle = g; ctx.fillRect(-20, y0, W + 40, H / 2);
      if (flash[p]) { ctx.fillStyle = `rgba(255,255,255,${flash[p] * 0.08})`; ctx.fillRect(0, y0, W, H / 2); }
    }
    // Orta çizgi ve kazanma çizgileri
    const cx = W / 2, span = H * 0.3, ry = H / 2 + rope * span;
    ctx.strokeStyle = 'rgba(255,255,255,.25)'; ctx.setLineDash([10, 10]); ctx.lineWidth = 3;
    ctx.beginPath(); ctx.moveTo(0, H / 2); ctx.lineTo(W, H / 2); ctx.stroke(); ctx.setLineDash([]);
    for (let p = 0; p < 2; p++) { const ly = H / 2 + (p === 0 ? span : -span); ctx.strokeStyle = TEAMS[p].col; ctx.lineWidth = 4; ctx.globalAlpha = 0.5; ctx.beginPath(); ctx.moveTo(W * 0.2, ly); ctx.lineTo(W * 0.8, ly); ctx.stroke(); ctx.globalAlpha = 1; }
    // Halat
    const wob = Math.sin(t * 30) * Math.min(4, Math.abs(vel) * 400);
    ctx.lineCap = 'round';
    ctx.strokeStyle = '#5a3a1a'; ctx.lineWidth = 16; ctx.beginPath(); ctx.moveTo(cx + wob, -20); ctx.lineTo(cx - wob, H + 20); ctx.stroke();
    ctx.strokeStyle = '#c89a5a'; ctx.lineWidth = 10; ctx.setLineDash([14, 8]); ctx.lineDashOffset = -rope * span; ctx.beginPath(); ctx.moveTo(cx + wob, -20); ctx.lineTo(cx - wob, H + 20); ctx.stroke(); ctx.setLineDash([]);
    // Orta bez (işaret)
    ctx.fillStyle = '#ffcf6a'; ctx.shadowBlur = 18; ctx.shadowColor = '#ffcf6a';
    ctx.beginPath(); ctx.moveTo(cx - 34, ry - 14); ctx.lineTo(cx + 34, ry - 14); ctx.lineTo(cx + 24, ry + 14); ctx.lineTo(cx - 24, ry + 14); ctx.closePath(); ctx.fill(); ctx.shadowBlur = 0;
    // Takımlar: halatın iki ucunda çeken figürler
    const k = Math.min(W, H) * 0.06, lean = Math.max(-0.35, Math.min(0.35, vel * 20));
    for (let i = 0; i < 3; i++) {
      puller(cx - k * 1.1, ry + span * 0.55 + i * k * 1.9 + k * 1.2, TEAMS[0].col, TEAMS[0].dark, 1, -lean + Math.sin(t * 20 + i) * flash[0] * 0.1, k);
      ctx.save(); ctx.translate(cx + k * 1.1, ry - span * 0.55 - i * k * 1.9 - k * 1.2); ctx.rotate(Math.PI); puller(0, 0, TEAMS[1].col, TEAMS[1].dark, 1, lean + Math.sin(t * 20 + i) * flash[1] * 0.1, k); ctx.restore();
    }
    // Güç halkaları
    for (let p = 0; p < 2; p++) { const b = bursts[p]; if (!b) continue; const pulse = 1 + Math.sin(t * 10) * 0.08, a = Math.min(1, b.age * 4) * Math.min(1, (2.2 - b.age) * 3);
      ctx.globalAlpha = a; ctx.strokeStyle = '#fff'; ctx.lineWidth = 5; ctx.shadowBlur = 20; ctx.shadowColor = TEAMS[p].col;
      ctx.beginPath(); ctx.arc(b.x, b.y, b.r * pulse, 0, Math.PI * 2); ctx.stroke(); ctx.fillStyle = TEAMS[p].col + '88'; ctx.fill();
      ctx.fillStyle = '#fff'; ctx.font = `900 ${b.r * 0.7}px system-ui`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText('x6', b.x, b.y); ctx.shadowBlur = 0; ctx.globalAlpha = 1; }
    for (const f of fx) { ctx.strokeStyle = f.col; ctx.globalAlpha = 1 - f.t / 0.6; ctx.lineWidth = 6; ctx.beginPath(); ctx.arc(f.x, f.y, 20 + f.t * 220, 0, Math.PI * 2); ctx.stroke(); ctx.globalAlpha = 1; }
    ctx.restore();
    // Skor tabelaları (üst takımınki ters çevrilmiş, karşıdaki oyuncu okuyabilsin)
    const label = (p) => { const me = mode === 'bot' ? (p === 0 ? 'SEN' : 'BİLGİSAYAR') : TEAMS[p].name; return `${me}  ${score[p]}`; };
    ctx.font = `800 ${Math.max(16, k * 0.6)}px system-ui`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillStyle = TEAMS[0].col; ctx.fillText(label(0), W * 0.27, H - Math.max(26, k * 0.8));
    ctx.save(); ctx.translate(mode === 'duo' ? W * 0.73 : W * 0.27, Math.max(26, k * 0.8)); ctx.rotate(mode === 'duo' ? Math.PI : 0); ctx.fillStyle = TEAMS[1].col; ctx.fillText(label(1), 0, 0); ctx.restore();
    // Geri sayım / tur sonu yazısı (iki yöne)
    let msg = '';
    if (state === 'count') msg = count > 0.2 ? String(Math.ceil(count)) : 'ÇEK!';
    else if (state === 'roundEnd') msg = mode === 'bot' ? (winner === 0 ? 'TUR SENİN!' : 'TUR BİLGİSAYARIN') : TEAMS[winner].name + ' ALDI!';
    else if (state === 'play' && taps[0] + taps[1] < 4) msg = 'DOKUN!';
    if (msg) {
      ctx.font = `900 ${Math.min(W, H) * 0.13}px system-ui`; ctx.fillStyle = '#fff'; ctx.shadowBlur = 20; ctx.shadowColor = '#000';
      ctx.fillText(msg, W / 2, H * 0.75);
      if (mode === 'duo') { ctx.save(); ctx.translate(W / 2, H * 0.25); ctx.rotate(Math.PI); ctx.fillText(msg, 0, 0); ctx.restore(); }
      ctx.shadowBlur = 0;
      if (state === 'count') { ctx.font = `700 ${Math.min(W, H) * 0.04}px system-ui`; ctx.fillStyle = '#eadbc8'; ctx.fillText('TUR ' + round + ' · ilk 2 turu alan kazanır', W / 2, H * 0.84); }
    }
  }
  let last = performance.now();
  function loop(now) { const dt = Math.min(0.05, (now - last) / 1000); last = now; update(dt); draw(); requestAnimationFrame(loop); }
  showMenu(); requestAnimationFrame(loop);
})();
</script>
</body>
</html>
