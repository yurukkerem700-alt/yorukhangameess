<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Refleks Düellosu</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #0e0b14; touch-action: none; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; font-family: system-ui, -apple-system, 'Segoe UI', sans-serif; }
  canvas { display: block; width: 100vw; height: 100vh; }
  #ui { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; pointer-events: none; }
  .panel { pointer-events: auto; text-align: center; color: #fff; background: rgba(14,10,22,.88); border: 1px solid rgba(255,255,255,.14); backdrop-filter: blur(6px); padding: 22px 24px; border-radius: 20px; width: min(420px, 88vw); }
  .panel h1 { margin: 0 0 4px; font-size: clamp(28px, 8vw, 44px); background: linear-gradient(90deg,#7dff9a,#3ad0ff); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .panel p { margin: 6px 0; color: #ddd4ee; font-size: 15px; line-height: 1.4; }
  .btn { display: block; width: 100%; margin-top: 10px; background: #fff; color: #0e0b14; border: 0; border-radius: 14px; padding: 14px 10px; font-size: 18px; font-weight: 800; cursor: pointer; touch-action: manipulation; }
  .row { display: flex; gap: 8px; margin-top: 10px; }
  .row .btn { margin-top: 0; padding: 14px 4px; background: linear-gradient(135deg,#7dff9a,#3ad0ff); }
  .small { font-size: 12px !important; opacity: .75; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="ui"><div class="panel" id="panel"></div></div>
<script>
(() => {
  const cv = document.getElementById('c'), ctx = cv.getContext('2d');
  let W, H, DPR;
  function resize() { DPR = Math.min(2, devicePixelRatio || 1); W = innerWidth; H = innerHeight; cv.width = W * DPR; cv.height = H * DPR; ctx.setTransform(DPR, 0, 0, DPR, 0, 0); }
  addEventListener('resize', resize); resize();
  const store = { get(k, d) { try { const v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); } catch (e) { return d; } }, set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} } };
  let ac = null;
  function beep(f, d, type, vol) { try { ac = ac || new (window.AudioContext || window.webkitAudioContext)(); const o = ac.createOscillator(), g = ac.createGain(); o.type = type || 'sine'; o.frequency.value = f; g.gain.value = vol || 0.06; g.gain.exponentialRampToValueAtTime(0.0001, ac.currentTime + d); o.connect(g).connect(ac.destination); o.start(); o.stop(ac.currentTime + d); } catch (e) {} }
  const buzz = (p) => { try { navigator.vibrate && navigator.vibrate(p); } catch (e) {} };

  const COLS = ['#ff4a5a', '#3aa8ff', '#ffc83a', '#b07dff'];
  const NAMES = ['KIRMIZI', 'MAVİ', 'SARI', 'MOR'];
  const TARGET = 5;
  let n = 2, bot = false, players = [], state = 'menu', phase = 'wait', timer = 0, goAt = 0, fakeAt = 0, fake = false, msg = '', msgCol = '#fff', t = 0, best = store.get('refleks_best', 0), roundWinner = -1, lastMs = 0;

  // Bölgeler: 2 oyuncu = alt/üst yarı, 3-4 oyuncu = dört çeyrek. rot: yazının o oyuncuya dönük açısı
  function zones() {
    if (n === 2) return [{ x: 0, y: H / 2, w: W, h: H / 2, rot: 0 }, { x: 0, y: 0, w: W, h: H / 2, rot: bot ? 0 : Math.PI }];
    const q = [{ x: 0, y: H / 2, w: W / 2, h: H / 2, rot: 0 }, { x: W / 2, y: 0, w: W / 2, h: H / 2, rot: Math.PI }, { x: W / 2, y: H / 2, w: W / 2, h: H / 2, rot: 0 }, { x: 0, y: 0, w: W / 2, h: H / 2, rot: Math.PI }];
    return q.slice(0, n);
  }
  function zoneAt(x, y) { const z = zones(); for (let i = 0; i < z.length; i++) { const a = z[i]; if (x >= a.x && x < a.x + a.w && y >= a.y && y < a.y + a.h) return i; } return -1; }

  function hit(i) {
    if (state !== 'play' || i < 0 || i >= n || players[i].out) return;
    if (bot && i === 1) return;
    press(i);
  }
  function press(i) {
    const p = players[i]; p.flash = 1;
    if (phase === 'go') {
      phase = 'result'; roundWinner = i; p.score++; lastMs = Math.round(performance.now() - goAt);
      if (!(bot && i === 1) && (!best || lastMs < best)) { best = lastMs; store.set('refleks_best', best); }
      msg = (bot ? (i === 0 ? 'SEN' : 'BİLGİSAYAR') : NAMES[i]) + ' +1 · ' + lastMs + ' ms'; msgCol = COLS[i];
      beep(880, 0.15, 'triangle', 0.08); buzz(40);
      if (p.score >= TARGET) setTimeout(gameOver, 1300); else setTimeout(nextRound, 1500);
    } else if (phase === 'wait') {
      // Erken basan bu tur dışarıda kalır ve 1 puan kaybeder
      p.out = true; p.score = Math.max(0, p.score - 1); p.shake = 1; beep(140, 0.25, 'sawtooth', 0.06); buzz([80, 40, 80]);
      msg = (bot ? (i === 0 ? 'SEN' : 'BİLGİSAYAR') : NAMES[i]) + ' ERKEN! −1'; msgCol = COLS[i];
      if (players.every(q => q.out)) { phase = 'result'; setTimeout(nextRound, 1300); }
    }
  }
  cv.addEventListener('touchstart', e => { e.preventDefault(); for (const tc of e.changedTouches) hit(zoneAt(tc.clientX, tc.clientY)); }, { passive: false });
  cv.addEventListener('mousedown', e => hit(zoneAt(e.clientX, e.clientY)));
  addEventListener('keydown', e => { if (e.repeat) return; const k = { KeyA: 0, KeyL: 1, KeyG: 2, KeyP: 3, Space: 0 }[e.code]; if (k !== undefined) hit(k); });

  const panel = document.getElementById('panel'), ui = document.getElementById('ui');
  function menu() {
    state = 'menu'; ui.style.display = 'flex';
    panel.innerHTML = `<h1>REFLEKS DÜELLOSU</h1>
      <p>Ekran <b style="color:#7dff9a">YEŞİL</b> olunca kendi bölgene ilk dokunan kazanır. Erken dokunan o turdan düşer ve 1 puan kaybeder. <b style="color:#ffc83a">Sarı</b> tuzak: basma!</p>
      <p class="small">Tek telefon, arkadaşlarla: telefonu ortaya koyun.</p>
      <div class="row">${[2, 3, 4].map(k => `<button class="btn" data-n="${k}">👥 ${k} KİŞİ</button>`).join('')}</div>
      <button class="btn" id="bot" style="background:rgba(255,255,255,.14);color:#fff">🤖 BİLGİSAYARA KARŞI</button>
      <p class="small" style="margin-top:12px">${best ? 'En hızlı tepkin: <b>' + best + ' ms</b> · ' : ''}${TARGET} puana ilk ulaşan kazanır · Klavye: A · L · G · P</p>`;
    panel.querySelectorAll('[data-n]').forEach(b => b.onclick = () => start(+b.dataset.n, false));
    panel.querySelector('#bot').onclick = () => start(2, true);
  }
  function start(k, b) { n = k; bot = b; players = Array.from({ length: n }, () => ({ score: 0, out: false, flash: 0, shake: 0 })); ui.style.display = 'none'; state = 'play'; try { ac = ac || new (window.AudioContext || window.webkitAudioContext)(); ac.resume(); } catch (e) {} nextRound(); }
  function nextRound() {
    if (state !== 'play') return;
    players.forEach(p => { p.out = false; }); phase = 'wait'; msg = 'BEKLE…'; msgCol = '#ff6a6a'; roundWinner = -1;
    timer = 1.4 + Math.random() * 3.2; fake = Math.random() < 0.3; fakeAt = fake ? timer * (0.35 + Math.random() * 0.3) : -1;
  }
  function gameOver() {
    state = 'over'; ui.style.display = 'flex';
    const w = players.reduce((a, p, i) => p.score > players[a].score ? i : a, 0);
    const who = bot ? (w === 0 ? '🏆 KAZANDIN!' : '🤖 BİLGİSAYAR KAZANDI') : '🏆 ' + NAMES[w] + ' KAZANDI!';
    panel.innerHTML = `<h1>${who}</h1><p style="font-size:22px;font-weight:800">${players.map((p, i) => `<span style="color:${COLS[i]}">${p.score}</span>`).join(' · ')}</p>
      ${best ? `<p class="small">En hızlı tepkin: ${best} ms</p>` : ''}
      <button class="btn" id="again">🔁 RÖVANŞ</button><button class="btn" id="m" style="background:rgba(255,255,255,.14);color:#fff">ANA MENÜ</button>`;
    panel.querySelector('#again').onclick = () => start(n, bot); panel.querySelector('#m').onclick = menu;
  }
  function update(dt) {
    t += dt; players.forEach(p => { p.flash = Math.max(0, p.flash - dt * 4); p.shake = Math.max(0, p.shake - dt * 3); });
    if (state !== 'play' || phase !== 'wait') return;
    timer -= dt;
    if (fake && fakeAt > 0 && timer <= fakeAt) { fakeAt = -1; phase = 'fake'; msg = 'BASMA!'; msgCol = '#ffc83a'; beep(330, 0.2); setTimeout(() => { if (phase === 'fake') { phase = 'wait'; msg = 'BEKLE…'; msgCol = '#ff6a6a'; } }, 700); return; }
    if (timer <= 0) {
      phase = 'go'; goAt = performance.now(); msg = 'ŞİMDİ!'; msgCol = '#7dff9a'; beep(1046, 0.12, 'square', 0.07);
      if (bot && !players[1].out) { const rt = 240 + Math.random() * 180; setTimeout(() => { if (phase === 'go' && state === 'play') press(1); }, rt); }
    }
  }
  // Sarı tuzak sırasında basmak da erken sayılır
  const _press = press;
  press = function (i) { if (phase === 'fake') { phase = 'wait'; _press(i); return; } _press(i); };

  // Yazıyı verilen genişliğe sığacak şekilde küçültür
  function fit(txt, x, y, maxW, px, wt) { ctx.font = `${wt} ${px}px system-ui`; const w = ctx.measureText(txt).width; if (w > maxW) ctx.font = `${wt} ${px * maxW / w}px system-ui`; ctx.fillText(txt, x, y); }
  function draw() {
    const bg = phase === 'go' ? '#1f7a3a' : phase === 'fake' ? '#7a5a0a' : state === 'play' ? '#3a0f18' : '#0e0b14';
    ctx.fillStyle = bg; ctx.fillRect(0, 0, W, H);
    if (state === 'menu') return;
    const z = zones(), fs = Math.min(W, H);
    z.forEach((a, i) => {
      const p = players[i]; if (!p) return;
      const sx = Math.sin(t * 60) * p.shake * 8;
      ctx.save(); ctx.translate(sx, 0);
      ctx.fillStyle = COLS[i] + (p.out ? '22' : '33'); ctx.fillRect(a.x + 4, a.y + 4, a.w - 8, a.h - 8);
      ctx.strokeStyle = COLS[i]; ctx.lineWidth = 4 + p.flash * 10; ctx.globalAlpha = p.out ? 0.35 : 1; ctx.strokeRect(a.x + 6, a.y + 6, a.w - 12, a.h - 12); ctx.globalAlpha = 1;
      if (roundWinner === i) { ctx.fillStyle = COLS[i] + '66'; ctx.fillRect(a.x, a.y, a.w, a.h); }
      ctx.translate(a.x + a.w / 2, a.y + a.h / 2); ctx.rotate(a.rot);
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillStyle = COLS[i];
      ctx.font = `900 ${fs * (n === 2 ? 0.2 : 0.14)}px system-ui`; ctx.fillText(p.score, 0, -fs * 0.02);
      ctx.fillStyle = '#fff';
      fit(p.out ? '✖ BU TUR DIŞARIDA' : (bot ? (i === 0 ? 'SEN' : '🤖 BİLGİSAYAR') : NAMES[i]), 0, fs * (n === 2 ? 0.14 : 0.11), a.w * 0.88, fs * 0.045, 800);
      // Her oyuncu kendi bölgesinde durum yazısını kendine dönük görür
      ctx.fillStyle = msgCol; ctx.shadowBlur = 12; ctx.shadowColor = '#000';
      fit(msg, 0, -a.h * 0.32, a.w * 0.9, fs * (n === 2 ? 0.1 : 0.07), 900); ctx.shadowBlur = 0;
      ctx.restore();
    });
  }
  let last = performance.now();
  function loop(now) { const dt = Math.min(0.05, (now - last) / 1000); last = now; update(dt); draw(); requestAnimationFrame(loop); }
  menu(); requestAnimationFrame(loop);
})();
</script>
</body>
</html>
